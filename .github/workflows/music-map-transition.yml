name: Music map transition test build
on:
  push:
    branches: [fix/music-map-transition-v112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/music-fix -G "Visual Studio 17 2022" -A x64 -DDINGOSDK_BUILD_LAUNCHER_TESTS=ON "-DDINGOSDK_VERSION=1.1.2-playlist-fix"
      - name: Build runtime and music regressions
        run: cmake --build build/music-fix --config Release --parallel 4 --target dingosdk_runtime dingosdk_music_lifetime_tests dingosdk_music_safety_tests dingosdk_mod_music_tests
      - name: Run isolated tests (no game)
        run: ctest --test-dir build/music-fix -C Release --output-on-failure -R "^(music_lifetime|music_safety|mod_music)$"
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-map-fix
          path: |
            build/music-fix/Release/ReSkate.dll
            build/music-fix/Release/ReSkate.pdb
          if-no-files-found: error
